behaviors:
  PlayerMLAgent:      
    trainer_type: ppo
    hyperparameters:
      batch_size: 512    # Please note that this is optimized for my GTX 1050 Ti (4GB VRAM)
      buffer_size: 2048 
      learning_rate: 3.0e-4
      beta: 0.01 # previously 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128  # Leaner model for lower VRAM
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 256
    summary_freq: 10000